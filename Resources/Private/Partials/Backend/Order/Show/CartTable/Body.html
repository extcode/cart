<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cart="http://typo3.org/ns/Extcode/Cart/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:section name="product">
    <tr>
        <td>
            {product.sku}
        </td>
        <td>
            {product.title}
            <f:if condition="!{product.shippable} || !{product.cancelable} || !{product.returnable}">
                <div class="mt-1">
                    <f:if condition="!{product.shippable}">
                        <span class="badge badge-info" data-order-product-property="not-shippable"><f:translate key="tx_cart_domain_model_order_product.not_shippable"/></span>
                    </f:if>
                    <f:if condition="!{product.cancelable}">
                        <span class="badge badge-warning" data-order-product-property="not-cancelable"><f:translate key="tx_cart_domain_model_order_product.not_cancelable"/></span>
                    </f:if>
                    <f:if condition="!{product.returnable}">
                        <span class="badge badge-warning" data-order-product-property="not-returnable"><f:translate key="tx_cart_domain_model_order_product.not_returnable"/></span>
                    </f:if>
                </div>
            </f:if>
        </td>
        <td class="cart-figure">
            <cart:format.currency currencySign="{currencySign}">{product.price}</cart:format.currency>
        </td>
        <td class="cart-figure">
            <cart:format.currency currencySign="{currencySign}">{product.discount}</cart:format.currency>
        </td>
        <td class="cart-figure">
            {product.count}
        </td>
        <td class="cart-figure">
            <cart:format.currency currencySign="{currencySign}">{product.net}</cart:format.currency>
        </td>
        <td class="cart-figure">
            <cart:format.currency currencySign="{currencySign}">{product.gross}</cart:format.currency>
        </td>
        <f:render partial="Backend/Order/Show/CartTable/TaxColumns"
                  arguments="{totalTaxes: totalTaxes, taxClass: product.taxClass, tax: product.tax, currencySign: currencySign}"/>
    </tr>
</f:section>

<f:for each="{orderItem.products}" as="product">
    <f:render section="product"
              arguments="{product: product, totalTaxes: orderItem.totalTax, currencySign: orderItem.currency}"/>
</f:for>
</html>
