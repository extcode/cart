<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cart="http://typo3.org/ns/Extcode/Cart/ViewHelpers"
      data-namespace-typo3-fluid="true">

<tr class="summary-cart-price">
    <td colspan="5">
        <f:translate key="tx_cart_domain_model_order_item.cart_price"/>
    </td>
    <td>
        <cart:format.currency currencySign="{orderItem.currency}">{orderItem.net}</cart:format.currency>
    </td>
    <td>
        <cart:format.currency currencySign="{orderItem.currency}">{orderItem.gross}</cart:format.currency>
    </td>
    <f:for each="{orderItem.totalTax}" as="totalTax">
        <td>
            <f:for each="{orderItem.tax}" as="tax">
                <f:if condition="{tax.taxClass.uid} == {totalTax.taxClass.uid}">
                    <cart:format.currency currencySign="{orderItem.currency}">{tax.tax}</cart:format.currency>
                </f:if>
            </f:for>
        </td>
    </f:for>
</tr>

<f:if condition="{orderItem.shipping}">
    <tr class="summary-shipping">
        <td colspan="5">
            <f:translate key="tx_cart_domain_model_order_item.order_shipping"/>
            {orderItem.shipping.name}
        </td>
        <td>
            <cart:format.currency currencySign="{orderItem.currency}">{orderItem.shipping.net}</cart:format.currency>
        </td>
        <td>
            <cart:format.currency currencySign="{orderItem.currency}">{orderItem.shipping.gross}</cart:format.currency>
        </td>
        <f:render partial="Order/Show/TaxColumns"
                  arguments="{totalTaxes: orderItem.totalTax, taxClass: orderItem.shipping.taxClass, tax: orderItem.shipping.tax, currencySign: orderItem.currency}"/>
    </tr>
</f:if>

<f:if condition="{orderItem.payment}">
    <tr class="summary-payment">
        <td colspan="5">
            <f:translate key="tx_cart_domain_model_order_item.order_payment"/>
            {orderItem.payment.name}
        </td>
        <td>
            <cart:format.currency currencySign="{orderItem.currency}">{orderItem.payment.net}</cart:format.currency>
        </td>
        <td>
            <cart:format.currency currencySign="{orderItem.currency}">{orderItem.payment.gross}</cart:format.currency>
        </td>
        <f:render partial="Order/Show/TaxColumns"
                  arguments="{totalTaxes: orderItem.totalTax, taxClass: orderItem.payment.taxClass, tax: orderItem.payment.tax, currencySign: orderItem.currency}"/>
    </tr>
</f:if>

<tr class="summary-total-price">
    <td colspan="5">
        <f:translate key="tx_cart_domain_model_order_item.cart_total_price"/>
    </td>
    <td>
        <cart:format.currency currencySign="{orderItem.currency}">{orderItem.totalNet}</cart:format.currency>
    </td>
    <td>
        <cart:format.currency currencySign="{orderItem.currency}">{orderItem.totalGross}</cart:format.currency>
    </td>
    <f:for each="{orderItem.totalTax}" as="totalTax">
        <td>
            <cart:format.currency currencySign="{orderItem.currency}">{totalTax.tax}</cart:format.currency>
        </td>
    </f:for>
</tr>
</html>
